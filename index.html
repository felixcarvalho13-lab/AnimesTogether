<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnimesTogether</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎌</text></svg>">
<link rel="stylesheet" href="style.css">

</head>
<body>
<div class="wrap">
  <div class="header-row">
    <div>
      <h1>🎌 AnimesTogether</h1>
      <p class="sub">Compartilhe. Acompanhe. Assista juntos.</p>
    </div>
    <div class="header-actions">
      <button class="theme-btn" id="themeBtn" aria-label="Trocar tema">☾</button>
      <button class="share-btn" id="shareBtn">Copiar link</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <div class="name-section" id="nameSection"></div>

  <div class="add-row">
    <input type="text" id="newName" placeholder="Nome do anime" maxlength="120" />
    <button class="primary" id="addBtn">Adicionar</button>
  </div>
  <div class="add-row2">
    <label for="newTotal">Eps:</label>
    <input type="number" id="newTotal" min="0" placeholder="ex: 24" />
    <input type="text" id="newNote" placeholder="Nota (opcional): ex: assistir dublado" style="flex:1;" />
  </div>

  <div class="add-row">
    <input type="text" id="searchBox" placeholder="Buscar na lista..." />
    <button class="share-btn" id="exportBtn">Exportar</button>
  </div>

  <div class="stats-bar" id="statsBar"></div>

  <div class="filters">
    <button class="active" data-filter="all">Todos</button>
    <button data-filter="pending">Para assistir</button>
    <button data-filter="watching">Assistindo</button>
    <button data-filter="watched">Já assistidos</button>
  </div>
  <p class="hint">Em "Para assistir", arraste os cards pelo ⠿ para reordenar por prioridade.</p>

  <div id="list"></div>
  <p class="status" id="status">Carregando lista...</p>
</div>

<script src="script.js" defer></script>
</body>
</html>
